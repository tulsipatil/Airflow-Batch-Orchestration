stock_analytics:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DBT_POSTGRES_HOST', 'postgres') }}"
      user: "{{ env_var('DBT_POSTGRES_USER', 'airflow') }}"
      password: "{{ env_var('DBT_POSTGRES_PASSWORD', 'airflow') }}"
      port: "{{ env_var('DBT_POSTGRES_PORT', 5432) | as_number }}"
      dbname: "{{ env_var('DBT_POSTGRES_DBNAME', 'airflow') }}"
      schema: "{{ env_var('DBT_POSTGRES_SCHEMA', 'analytics') }}"
      threads: 4
      keepalives_idle: 0
      search_path: "{{ env_var('DBT_POSTGRES_SCHEMA', 'analytics') }}"
      
    prod:
      type: postgres
      host: "{{ env_var('DBT_POSTGRES_HOST', 'postgres') }}"
      user: "{{ env_var('DBT_POSTGRES_USER', 'airflow') }}"
      password: "{{ env_var('DBT_POSTGRES_PASSWORD', 'airflow') }}"
      port: "{{ env_var('DBT_POSTGRES_PORT', 5432) | as_number }}"
      dbname: "{{ env_var('DBT_POSTGRES_DBNAME', 'airflow') }}"
      schema: "{{ env_var('DBT_POSTGRES_SCHEMA', 'analytics') }}"
      threads: 8
      keepalives_idle: 0
      search_path: "{{ env_var('DBT_POSTGRES_SCHEMA', 'analytics') }}"
      # Add more production-specific settings as needed
